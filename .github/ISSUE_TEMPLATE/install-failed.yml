name: "安装失败"
description: "install.bat 报错、闪退、乱码、下载失败等安装问题"
labels: ["install", "triage"]
body:
  - type: input
    id: error_message
    attributes:
      label: "你看到的错误信息"
      description: "截图或复制文字，越完整越好"
      placeholder: "[ERROR] ..."
    validations:
      required: true
  - type: dropdown
    id: stuck_step
    attributes:
      label: "卡在哪一步"
      options:
        - "Step 1/6 - 检测 Python"
        - "Step 2/6 - 升级 pip"
        - "Step 3/6 - 检测 CUDA / 安装 PyTorch"
        - "Step 4/6 - 安装 Python 依赖"
        - "Step 5/6 - 安装 Node.js 依赖"
        - "Step 6/6 - 体检"
        - "根本没到 Step 显示，直接闪退"
        - "中文乱码"
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: "Windows 版本"
      placeholder: "例如 Windows 10 22H2"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: "显卡型号"
      placeholder: "例如 RTX 3060, GTX 1660, 不确定请写“不确定”"
    validations:
      required: true
  - type: dropdown
    id: has_python
    attributes:
      label: "之前装过 Python 吗"
      options:
        - "没有"
        - "有，但不确定版本"
        - "有，版本是 3.10 / 3.11 / 3.12"
        - "有，版本是 3.13+"
    validations:
      required: true
  - type: dropdown
    id: has_node
    attributes:
      label: "之前装过 Node.js 吗"
      options:
        - "没有"
        - "有，但不确定版本"
        - "有"
    validations:
      required: true
