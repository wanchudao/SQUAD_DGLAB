; ============================================================
; SQUAD_DGLAB 强度配置文件
; ============================================================
;
; 用法:用记事本打开本文件,修改数字,保存,然后重启 start_all.bat
;
; 安全提示:
;   1. 强度范围 0~200,但 DG-LAB 真机推荐 0~50 之间使用
;   2. APP 端有强度上限滑块作为最终保护,请务必先把 APP 上限调到
;      舒适范围,再启用真实模式 (DGLAB_REAL=1)
;   3. 改动只影响 ACTION_PROFILES 强度梯度,APP 滑块永远是最高保护
;
; 默认值是 v1.0.0 真机验证后的保守值,如果体感不够再往上调一点。
;
; 调强度的更直接方式:
;   - DG-LAB APP 里直接拖强度滑块 (实时生效,不用改本文件)
;   - 本文件适合微调"事件之间的相对强度比例"
; ============================================================


[strength]
; -------- 核心事件 (v1.0 已真机验证) --------

; 流血:轻反馈,提醒玩家当前在掉血
; 推荐范围 5~15
weak_pulse = 10
; 濒死:中等强度反馈,玩家进入倒地状态
; 推荐范围 15~25
strong_pulse = 20

; 死亡:最强反馈,玩家彻底阵亡
; 推荐范围 30~50
death_pulse = 40

; -------- 实验功能:压制反馈 (v1.0 默认关闭) --------

; 轻度压制
; 推荐范围 5~12
suppression_light_pulse = 8

; 重度压制
; 推荐范围 10~18
suppression_heavy_pulse = 14


[duration]
; -------- 持续时间 (秒) --------
; 不建议大幅修改,这些值跟波形模板长度匹配
; 调短可能导致波形被截断,调长安全但会感觉拖泥带水

weak_pulse = 2.0
strong_pulse = 4.0
death_pulse = 5.0
suppression_light_pulse = 1.5
suppression_heavy_pulse = 2.0
